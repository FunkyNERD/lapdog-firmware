; LapDog timer firmware - ESP32-C5, ESP-IDF via the pioarduino platform
; (upstream platformio/espressif32 has no C5 support).
[platformio]
default_envs = c5_mini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = direct
; 4 MB flash, ~2 MB app slot (the image is past the default 1 MB).
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
lib_deps =
    vrxc-msp=git+ssh://git@git.hazaar.dev/jamie/vrxc-msp.git
; Working on vrxc-msp alongside? Point at the local checkout instead:
;   vrxc-msp=symlink://../vrxc-msp

; Mini ESP32-C5 dev board - the timer that sits by the gate.
[env:c5_mini]
board = esp32-c5-devkitc-1

; 01Space ESP32-C3 0.42" OLED board (elrs-race-test's board) - test build for
; ESP-NOW, BLE, the USB console and the app, with heat, lap and lap times on the
; little OLED. No SDR on the C3 (2.4 GHz only): the capture stub stays, so laps
; come from `sim`. LAPDOG_OLED=0 leaves the OLED dark.
;   pio run -e c3_oled -t upload
[env:c3_oled]
board = esp32-c3-devkitm-1
build_flags =
    -DLAPDOG_OLED=1

; Waveshare ESP32-C5-Touch-LCD-3.5 - the touch timer: the same timer, with a
; 480x320 touchscreen (ST7796 + FT6336, LVGL 9) to arm it, watch the laps and
; change every setting without a phone. ESP32-C5-WROOM-1U: fit a 5.8 GHz
; antenna to its U.FL connector. 8 MB PSRAM holds the display buffers.
;   pio run -e c5_touch -t upload
[env:c5_touch]
board = esp32-c5-devkitc-1
board_build.partitions = partitions_touch.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
board_build.cmake_extra_args =
    -DLAPDOG_TOUCH=1
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.touch

; Waveshare ESP32-C5-LCD-1.47 - the timer with a small status screen: 1.47" 320x172
; ST7789 over SPI, no touch (BOOT and the app do the controlling), an RGB LED, 4 MB
; flash, no PSRAM. Same flash layout as the mini; no website sync (the microSD slot
; shares the display's SPI pins).
;   pio run -e c5_lcd147 -t upload
[env:c5_lcd147]
board = esp32-c5-devkitc-1
board_build.cmake_extra_args =
    -DLAPDOG_LCD147=1
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.lcd147

; Off-hardware unit tests (detector logic, frame encoding): pio test -e native
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Iinclude
