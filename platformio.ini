; LapDog timer firmware - ESP32-C5, ESP-IDF via the pioarduino platform
; (upstream platformio/espressif32 has no C5 support).
[platformio]
default_envs = c5_mini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    vrxc-msp=git+ssh://git@git.hazaar.io/jamie/vrxc-msp.git
; Working on vrxc-msp alongside? Point at the local checkout instead:
;   vrxc-msp=symlink://../vrxc-msp

; Mini ESP32-C5 dev board - the timer that sits by the gate.
[env:c5_mini]
board = esp32-c5-devkitc-1

; Off-hardware unit tests (detector logic, frame encoding): pio test -e native
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Iinclude
