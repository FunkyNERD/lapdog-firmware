; LapDog timer firmware - ESP32-C5, ESP-IDF via the pioarduino platform
; (upstream platformio/espressif32 has no C5 support).
[platformio]
default_envs = c5_mini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = direct
; 4 MB flash, ~2 MB app slot (the image is past the default 1 MB).
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
lib_deps =
    vrxc-msp=git+ssh://git@git.hazaar.io/jamie/vrxc-msp.git
; Working on vrxc-msp alongside? Point at the local checkout instead:
;   vrxc-msp=symlink://../vrxc-msp

; Mini ESP32-C5 dev board - the timer that sits by the gate.
[env:c5_mini]
board = esp32-c5-devkitc-1

; ESP32-C3 SuperMini - test build for ESP-NOW, BLE, the USB console and the app.
; No SDR on the C3 (2.4 GHz only): the capture stub stays, so laps come from `sim`.
;   pio run -e c3_test -t upload
[env:c3_test]
board = nologo_esp32c3_super_mini

; 01Space ESP32-C3 0.42" OLED board (elrs-race-test's board) - the same test
; build, plus heat, lap and lap times on the little OLED. LAPDOG_OLED=0 leaves
; the OLED dark.
;   pio run -e c3_oled -t upload
[env:c3_oled]
board = esp32-c3-devkitm-1
build_flags =
    -DLAPDOG_BOARD_01SPACE_C3
    -DLAPDOG_OLED=1

; Off-hardware unit tests (detector logic, frame encoding): pio test -e native
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Iinclude
